<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rande 💖</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
    (function(){
        emailjs.init("zK7oGkzr0hR_ox-t8"); 
    })();
</script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; min-height: 100vh; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(rgba(30, 10, 20, 0.55), rgba(30, 10, 20, 0.55)), url("https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1920&q=80");
    background-size: cover; background-position: center; background-attachment: fixed;
    display: flex; justify-content: center; align-items: center; padding: 24px 16px; position: relative; color: #2d3748;
}
.floating-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 1; }
.floating-item {
    position: absolute; font-size: 22px; animation: float 14s infinite linear; bottom: -60px; pointer-events: none;
    background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.4);
    width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
@keyframes float {
    0% { opacity: 0; transform: translateY(0) rotate(0deg) scale(0.8); }
    15% { opacity: 1; } 85% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-115vh) rotate(360deg) scale(1.15); }
}
.floating-item:nth-child(1) { left: 8%; animation-delay: 0s; animation-duration: 12s; }
.floating-item:nth-child(2) { left: 28%; animation-delay: 3s; animation-duration: 15s; }
.floating-item:nth-child(3) { left: 50%; animation-delay: 1s; animation-duration: 13s; }
.floating-item:nth-child(4) { left: 72%; animation-delay: 5s; animation-duration: 16s; }
.floating-item:nth-child(5) { left: 88%; animation-delay: 2s; animation-duration: 11s; }

.card {
    background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(20px); padding: 40px 32px; border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3); max-width: 480px; width: 100%; text-align: center; position: relative; z-index: 10;
}
h1 { color: #1a202c; font-size: 1.75rem; font-weight: 700; margin-bottom: 6px; }
.subtitle { color: #4a5568; font-size: 0.95rem; margin-bottom: 24px; font-weight: 500; }
form { display: flex; flex-direction: column; gap: 1.25rem; text-align: left; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 0.88rem; font-weight: 700; color: #2d3748; }
input, select, textarea {
    width: 100%; padding: 12px 16px; border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 14px;
    font-family: inherit; font-size: 0.95rem; background: rgba(255, 255, 255, 0.85); color: #2d3748; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: #d53f8c; background: #ffffff; box-shadow: 0 0 0 4px rgba(237, 100, 166, 0.2); }
textarea { min-height: 90px; resize: vertical; }

button {
    border: none; padding: 14px 28px; border-radius: 14px; cursor: pointer; font-weight: 700;
    font-size: 0.95rem; font-family: inherit; transition: all 0.25s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.submit-btn { background: linear-gradient(135deg, #d53f8c 0%, #b83280 100%); color: white; width: 100%; box-shadow: 0 8px 20px rgba(213, 63, 140, 0.35); margin-top: 8px; }
.btn-back { background: rgba(237, 242, 247, 0.8); color: #4a5568; width: 100%; margin-top: 10px; border: 1px solid rgba(203, 213, 224, 0.6); }
.hidden { display: none !important; }
.alert-bubble { background: rgba(254, 215, 215, 0.95); color: #9b2c2c; border: 1px solid #feb2b2; padding: 12px; border-radius: 14px; margin-bottom: 16px; font-weight: 600; }
#confirmationMessage { padding: 24px; background: rgba(254, 218, 230, 0.95); color: #702459; border-radius: 18px; margin-top: 10px; font-weight: 600; }
</style>
</head>
<body>

<div class="floating-container">
    <div class="floating-item">💖</div>
    <div class="floating-item">🌹</div>
    <div class="floating-item">✨</div>
    <div class="floating-item">🥂</div>
    <div class="floating-item">💌</div>
</div>

<div class="card">
    <h1>Kam zajdeme na rande? 💖</h1>
    <p class="subtitle">Naplánuj náš společný romantický čas.</p>

    <div id="errorBubble" class="alert-bubble hidden"></div>

    <form id="dateForm" novalidate>
        <div class="form-group">
            <label for="date">Kdy to bude?</label>
            <input type="date" id="date">
        </div>
        <div class="form-group">
            <label for="time">V kolik hodin?</label>
            <input type="time" id="time">
        </div>
        <div class="form-group">
            <label for="place">Kam vyrazíme?</label>
            <select id="place">
                <option value="">Vyber místo...</option>
                <option>Do oblíbené kavárny na něco dobrého ☕</option>
                <option>Na luxusní večeři 🍷</option>
                <option>Na procházku při západu slunce 🌅</option>
                <option>Do divadla nebo za kulturou 🎭</option>
                <option>Nechám to jako překvapení ✨</option>
            </select>
        </div>
        <div class="form-group">
            <label for="note">Nějaké tajné přání?</label>
            <textarea id="note" placeholder="Napiš, co by sis přála..."></textarea>
        </div>
        <div>
            <button type="submit" id="submitBtn" class="submit-btn">💖 Naplánovat rande!</button>
            <button type="button" class="btn-back" id="backBtn">⬅ Zpět</button>
        </div>
    </form>

    <div id="confirmationMessage" class="hidden">
        <div style="margin-bottom: 15px;">Rande domluveno a kalendář stažen! Už se na tebe nesmírně těším! 🥰</div>
        <button type="button" class="btn-back" onclick="history.back()">⬅ Zpět</button>
    </div>
</div>

<script>
document.getElementById("backBtn").addEventListener("click", () => history.back());

document.getElementById("dateForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const rawDate = document.getElementById("date").value;
    const timeVal = document.getElementById("time").value;
    const placeVal = document.getElementById("place").value;
    const noteVal = document.getElementById("note").value;
    const errorBubble = document.getElementById("errorBubble");
    const submitBtn = document.getElementById("submitBtn");

    if (!rawDate || !timeVal || !placeVal) {
        errorBubble.textContent = "Lásko, chybí ti vyplnit datum, čas nebo místo! 🥺";
        errorBubble.classList.remove("hidden");
        return;
    }

    const [year, month, day] = rawDate.split("-");
    const formattedDate = `${day}.${month}.${year}`;

    errorBubble.classList.add("hidden");
    submitBtn.disabled = true;
    submitBtn.textContent = "Odesílám pozvánku... 💌";

    const templateParams = {
        date_val: formattedDate,
        time_val: timeVal,
        activity_val: "💖 Rande: " + placeVal,
        note_val: noteVal || "Nic speciálního nepsala"
    };

    emailjs.send("service_db6ocwg", "template_w9939jc", templateParams)
        .then(() => {
            // Automatické vytvoření a stažení .ics souboru pro rande
            const [y, m, d] = rawDate.split("-").map(Number);
            const [hours, minutes] = timeVal.split(":").map(Number);
            
            const start = new Date(y, m - 1, d, hours, minutes);
            // Rande bude trvat výchozí 2 hodiny
            const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);

            function formatICSDate(date) {
                const pad = n => String(n).padStart(2, "0");
                return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}T${pad(date.getHours())}${pad(date.getMinutes())}00`;
            }

            const uid = "rande-" + Date.now() + "@moje-stranka";
            const ics = [
                "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Rande//CZ", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
                "BEGIN:VEVENT", `UID:${uid}`, `DTSTAMP:${formatICSDate(new Date())}`,
                `DTSTART;TZID=Europe/Prague:${formatICSDate(start)}`, `DTEND;TZID=Europe/Prague:${formatICSDate(end)}`,
                `SUMMARY:💖 Rande – ${placeVal}`, `DESCRIPTION:Poznámka: ${noteVal || "Nic speciálního"}`,
                "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Nezapomeň, dnes máme rande! 🥰", "TRIGGER:-PT2H", "END:VALARM",
                "END:VEVENT", "END:VCALENDAR"
            ].join("\r\n");

            const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url; link.download = "rande.ics";
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            // Zobrazení potvrzení
            document.getElementById("dateForm").classList.add("hidden");
            document.getElementById("confirmationMessage").classList.remove("hidden");
        })
        .catch(() => {
            errorBubble.textContent = "Něco se pokazilo, zkus to prosím znovu! 🥺";
            errorBubble.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = "💖 Naplánovat rande!";
        });
});
</script>
</body>
</html>
