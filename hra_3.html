<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz o nás 🧠</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fef9c3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
button { background: #ca8a04; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; width: 100%; }
.ans { background: #fef08a; color: #713f12; }
#feedback { margin-top: 15px; font-weight: bold; }
</style>
</head>
<body>
<div class="card">
    <h2>Kvíz o nás 🧠</h2>
    <p id="question">Kde jsme měli naše první oficiální rande?</p>
    <div id="options">
        <button class="ans" onclick="check(false)">V tramvaji 🚊</button>
        <button class="ans" onclick="check(true)">V kavárně ☕</button>
        <button class="ans" onclick="check(false)">V knihovně 📚</button>
    </div>
    <div id="feedback"></div>
</div>
<script>
function check(isCorrect) {
    const fb = document.getElementById('feedback');
    if(isCorrect) {
        fb.style.color = "green";
        fb.innerHTML = "Správně! Jsi moje jednička! 🥰";
    } else {
        fb.style.color = "red";
        fb.innerHTML = "Špatně! Zkus to znova, lásko 😄";
    }
}
</script>
</body>
</html>
