<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Klasické Lodě ⛵</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #fdf2f8;
    color: #4a5568;
    margin: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    touch-action: manipulation;
}
.container {
    background: white;
    padding: 15px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(219, 39, 119, 0.1);
    width: 100%;
    max-width: 480px;
    text-align: center;
}
h2 { color: #db2777; margin-top: 0; font-size: 1.4rem; }
.status-box {
    background: #fdf2f8;
    border: 2px dashed #f472b6;
    padding: 8px;
    border-radius: 12px;
    margin-bottom: 10px;
    font-weight: 600;
    font-size: 0.85rem;
    color: #be185d;
}
.btn {
    background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.95rem;
    font-family: inherit;
    width: 100%;
    margin-top: 8px;
    box-shadow: 0 4px 15px rgba(219, 39, 119, 0.3);
}
.btn-secondary {
    background: #e2e8f0;
    color: #4a5568;
    box-shadow: none;
    padding: 6px 10px;
    font-size: 0.85rem;
    width: auto;
    display: inline-block;
    margin-bottom: 8px;
}
.board-container {
    margin-top: 10px;
}
.board-title {
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 4px;
    color: #db2777;
}

/* PŘESNÉ ROZMĚRY MŘÍŽKY (32px buňky + 2px mezera) */
.grid {
    display: grid;
    grid-template-columns: repeat(10, 32px);
    grid-template-rows: repeat(10, 32px);
    gap: 2px;
    background: #0284c7;
    padding: 4px;
    border-radius: 8px;
    margin-bottom: 10px;
    justify-content: center;
}
.cell {
    width: 32px;
    height: 32px;
    background: #f0f9ff;
    border: none;
    border-radius: 3px;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    color: #0369a1;
}
.cell:hover { background: #e0f2fe; }

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    margin-bottom: 10px;
    font-family: inherit;
    text-align: center;
    font-size: 1rem;
}
.fleet-dock {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 12px;
    background: #f8fafc;
    padding: 10px;
    border-radius: 12px;
    border: 2px dashed #cbd5e1;
    min-height: 75px;
    align-items: center;
}

/* DESIGN LODÍ V DOCKU */
.ship-item {
    display: flex;
    gap: 2px;
    background: #0284c7;
    border: 2px solid #0369a1;
    border-radius: 6px;
    padding: 2px;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 3px 6px rgba(2, 132, 199, 0.2);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
}
.ship-item:hover {
    transform: scale(1.03);
}
.ship-item.selected {
    border: 2px solid #ea580c;
    box-shadow: 0 0 10px rgba(234, 88, 12, 0.6);
    transform: scale(1.05);
}

.ship-segment {
    width: 28px;
    height: 28px;
    background: #ffffff;
    border: 1px solid #bae6fd;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
}

.ship-segment.bow { border-top-left-radius: 8px; border-bottom-left-radius: 8px; background: #e0f2fe; }
.ship-segment.stern { border-top-right-radius: 8px; border-bottom-right-radius: 8px; background: #e0f2fe; }
.ship-segment.body { background: #f0f9ff; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
    <h2>Klasické Lodě ⛵</h2>
    
    <!-- SEKCE PRO PŘIPOJENÍ -->
    <div id="setupSection">
        <div class="status-box">Zadejte název místnosti pro spárování (např. "lodniparte1")</div>
        <input type="text" id="roomInput" placeholder="Název místnosti...">
        <button class="btn" onclick="joinGame()">Vstoupit do hry</button>
    </div>

    <!-- SEKCE HRY -->
    <div id="gameSection" class="hidden">
        <div class="status-box" id="statusMessage">Načítání stavu hry...</div>
        
        <!-- Umisťování lodí -->
        <div id="placementPhase">
            <p id="instructionText" style="font-size: 0.8rem; margin: 4px 0; font-weight: 600; color: #0284c7;">1. Klikni na loď v docku, 2. Klikni na políčko v mřížce</p>
            <button class="btn-secondary" id="rotateBtn" onclick="toggleOrientation()">Směr: Vodorovně ➡️</button>
            <div class="fleet-dock" id="fleetDock"></div>
            <div class="grid" id="placementGrid"></div>
            <button class="btn" id="readyBtn" onclick="setReady()" disabled>Potvrdit rozestavění ⚓</button>
        </div>

        <!-- Bojová fáze -->
        <div id="battlePhase" class="hidden">
            <div class="board-container">
                <div class="board-title">Nepřátelské moře (Střílej sem):</div>
                <div class="grid" id="shootingGrid"></div>
            </div>
            <div class="board-container">
                <div class="board-title">Tvoje flotila:</div>
                <div class="grid" id="myDefenseGrid"></div>
            </div>
        </div>

        <button class="btn btn-secondary" onclick="location.reload()" style="width:100%; margin-top:10px;">Opustit hru</button>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA-RCJcraf1WBLKs48u6521NZ0I1iGtSPxI",
        authDomain: "laska-web.firebaseapp.com",
        databaseURL: "https://laska-web-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "laska-web",
        storageBucket: "laska-web.firebasestorage.app",
        messagingSenderId: "258056299985",
        appId: "1:258056299985:web:9f30091072f5ece57a2cf0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const BOARD_SIZE = 100;
    let roomId = "";
    let playerRole = ""; 
    let gameState = {};

    let availableShips = [
        { id: '4_1', size: 4 },
        { id: '3_1', size: 3 },
        { id: '3_2', size: 3 },
        { id: '2_1', size: 2 },
        { id: '2_2', size: 2 },
        { id: '2_3', size: 2 },
        { id: '1_1', size: 1 },
        { id: '1_2', size: 1 },
        { id: '1_3', size: 1 },
        { id: '1_4', size: 1 }
    ];
    let orientation = 'H'; // 'H' = vodorovně, 'V' = svisle
    let placedShipsMap = {}; // index -> shipId
    let selectedShip = null; // Právě vybraná loď k umístění

    window.joinGame = function() {
        const input = document.getElementById('roomInput').value.trim();
        if (!input) {
            alert("Zadej prosím název místnosti!");
            return;
        }
        roomId = input;
        
        const roomRef = ref(db, 'rooms/' + roomId);
        get(roomRef).then((snapshot) => {
            const val = snapshot.val();
            if (!val) {
                playerRole = "p1";
                set(roomRef, {
                    status: 'placement',
                    turn: 'p1',
                    p1Ready: false,
                    p2Ready: false
                });
            } else if (!val.p2Ready && val.status === 'placement' && !val.p2Ships) {
                playerRole = "p2";
            } else {
                playerRole = "p2";
            }

            document.getElementById('setupSection').classList.add('hidden');
            document.getElementById('gameSection').classList.remove('hidden');
            initPlacementUI();
            listenToGame();
        });
    }

    function initPlacementUI() {
        renderDock();
        renderPlacementGrid();
    }

    function renderDock() {
        const dock = document.getElementById('fleetDock');
        dock.innerHTML = '';
        if (availableShips.length === 0) {
            dock.innerHTML = '<span style="font-size:0.85rem; color:#0284c7; font-weight:700;">Všechny lodě jsou na ploše! 🎉</span>';
            selectedShip = null;
            return;
        }
        availableShips.forEach(ship => {
            const div = document.createElement('div');
            div.className = 'ship-item';
            if (selectedShip && selectedShip.id === ship.id) {
                div.classList.add('selected');
            }

            div.onclick = () => {
                selectedShip = ship;
                renderDock();
                document.getElementById('instructionText').textContent = `Vybrána loď (${ship.size} dílky). Klikni na hrací plochu!`;
            };

            for (let i = 0; i < ship.size; i++) {
                const seg = document.createElement('div');
                seg.className = 'ship-segment';
                
                if (ship.size === 1) {
                    seg.classList.add('bow');
                    seg.textContent = '⛵';
                } else if (i === 0) {
                    seg.classList.add('bow');
                    seg.textContent = '⚓';
                } else if (i === ship.size - 1) {
                    seg.classList.add('stern');
                    seg.textContent = '🚢';
                } else {
                    seg.classList.add('body');
                    seg.textContent = '⚙️';
                }
                div.appendChild(seg);
            }
            dock.appendChild(div);
        });
    }

    window.toggleOrientation = function() {
        orientation = orientation === 'H' ? 'V' : 'H';
        document.getElementById('rotateBtn').textContent = orientation === 'H' ? 'Směr: Vodorovně ➡️' : 'Směr: Svisle ⬇️';
    }

    function renderPlacementGrid() {
        const grid = document.getElementById('placementGrid');
        grid.innerHTML = '';
        for (let i = 0; i < BOARD_SIZE; i++) {
            const btn = document.createElement('button');
            btn.classList.add('cell');
            
            if (placedShipsMap[i]) {
                btn.textContent = '🚢';
                btn.style.background = '#e0f2fe';
            } else {
                btn.textContent = '·';
                btn.style.background = '#f0f9ff';
            }

            const currentIndex = i;
            btn.onclick = () => {
                // Pokud na políčku už loď je, kliknutím ji vrátíme do docku
                if (placedShipsMap[currentIndex]) {
                    const targetShipId = placedShipsMap[currentIndex];
                    let shipSize = parseInt(targetShipId.split('_')[0]);

                    for (let k in placedShipsMap) {
                        if (placedShipsMap[k] === targetShipId) {
                            delete placedShipsMap[k];
                        }
                    }

                    availableShips.push({
                        id: targetShipId,
                        size: shipSize
                    });

                    renderPlacementGrid();
                    renderDock();
                    document.getElementById('readyBtn').disabled = true;
                    document.getElementById('instructionText').textContent = "Loď vrácena do docku. Vyber jinou.";
                    return;
                }

                // Pokud máme vybranou loď, umístíme ji
                if (selectedShip) {
                    placeSelectedShip(currentIndex);
                }
            };

            grid.appendChild(btn);
        }
    }

    function placeSelectedShip(index) {
        const row = Math.floor(index / 10);
        const col = index % 10;
        const size = selectedShip.size;

        if (orientation === 'H' && col + size > 10) {
            alert("Loď se v tomto směru vejde na řádek!");
            return;
        }
        if (orientation === 'V' && row + size > 10) {
            alert("Loď se v tomto směru vejde do sloupce!");
            return;
        }

        let targetIndices = [];
        for (let i = 0; i < size; i++) {
            let targetIndex = orientation === 'H' ? index + i : index + (i * 10);
            if (placedShipsMap[targetIndex]) {
                alert("Tady už nějaká loď překáží!");
                return;
            }
            targetIndices.push(targetIndex);
        }

        targetIndices.forEach(idx => {
            placedShipsMap[idx] = selectedShip.id;
        });

        // Odebereme loď z dostupných
        availableShips = availableShips.filter(s => s.id !== selectedShip.id);
        selectedShip = null;

        renderPlacementGrid();
        renderDock();

        document.getElementById('instructionText').textContent = "1. Klikni na loď v docku, 2. Klikni na políčko v mřížce";

        if (availableShips.length === 0) {
            document.getElementById('readyBtn').disabled = false;
            document.getElementById('instructionText').textContent = "Všechny lodě jsou rozestavěné! Můžeš potvrdit hru. 🎉";
        }
    }

    window.setReady = function() {
        const myShipsArray = Array(BOARD_SIZE).fill(false);
        for (let i = 0; i < BOARD_SIZE; i++) {
            if (placedShipsMap[i]) myShipsArray[i] = true;
        }

        const updates = {};
        updates[playerRole + 'Ships'] = myShipsArray;
        updates[playerRole + 'Ready'] = true;
        update(ref(db, 'rooms/' + roomId), updates);
        
        document.getElementById('placementPhase').classList.add('hidden');
        document.getElementById('statusMessage').textContent = "Čekáme, až partnerka rozmístí lodě... ⏳";
    }

    function listenToGame() {
        const roomRef = ref(db, 'rooms/' + roomId);
        onValue(roomRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            gameState = data;

            if (data.p1Ready && data.p2Ready && data.status === 'placement') {
                if (playerRole === 'p1') {
                    update(roomRef, { status: 'battle' });
                }
            }

            if (data.status === 'battle') {
                document.getElementById('placementPhase').classList.add('hidden');
                document.getElementById('battlePhase').classList.remove('hidden');
                renderBattleBoards();
                
                const isMyTurn = data.turn === playerRole;
                document.getElementById('statusMessage').textContent = isMyTurn ? 
                    "Tvůj tah! Zvol políčko na nepřátelské mřížce 🎯" : 
                    "Na tahu je partnerka, vyčkej na její útok... ☕";
            }
        });
    }

    function renderBattleBoards() {
        const shootGrid = document.getElementById('shootingGrid');
        shootGrid.innerHTML = '';
        const oppKey = playerRole === 'p1' ? 'p2' : 'p1';
        const oppShips = gameState[oppKey + 'Ships'] || [];
        const shotsData = gameState[playerRole + 'Shots'] || Array(BOARD_SIZE).fill(null);

        for (let i = 0; i < BOARD_SIZE; i++) {
            const btn = document.createElement('button');
            btn.classList.add('cell');
            let symbol = '·';
            if (shotsData[i] === 'hit') symbol = '💥';
            if (shotsData[i] === 'miss') symbol = '❌';
            btn.textContent = symbol;
            
            btn.onclick = () => fireShot(i, oppShips, shotsData);
            shootGrid.appendChild(btn);
        }

        const defenseGrid = document.getElementById('myDefenseGrid');
        defenseGrid.innerHTML = '';
        const myActiveShips = gameState[playerRole + 'Ships'] || Array(BOARD_SIZE).fill(false);
        const myOpponentShots = gameState[oppKey + 'Shots'] || Array(BOARD_SIZE).fill(null);

        for (let i = 0; i < BOARD_SIZE; i++) {
            const div = document.createElement('div');
            div.classList.add('cell');
            let symbol = '·';
            if (myActiveShips[i]) symbol = '🚢';
            if (myOpponentShots[i] === 'hit') symbol = '💥';
            if (myOpponentShots[i] === 'miss') symbol = '❌';
            div.textContent = symbol;
            defenseGrid.appendChild(div);
        }

        checkWinCondition(oppShips, shotsData, myActiveShips, myOpponentShots);
    }

    function fireShot(index, oppShips, shotsData) {
        if (gameState.turn !== playerRole) return;
        if (shotsData[index] !== null) return; 

        const updatedShots = [...shotsData];
        const isHit = oppShips[index] === true;
        updatedShots[index] = isHit ? 'hit' : 'miss';

        const nextTurn = playerRole === 'p1' ? 'p2' : 'p1';

        const updates = {};
        updates[playerRole + 'Shots'] = updatedShots;
        updates['turn'] = nextTurn;
        
        update(ref(db, 'rooms/' + roomId), updates).catch((error) => {
            console.error("Chyba při odesílání tahu:", error);
        });
    }

    function checkWinCondition(oppShips, myShotsArr, myShipsArr, oppShotsArr) {
        const oppShipCount = oppShips.filter(Boolean).length;
        const myHits = myShotsArr.filter(s => s === 'hit').length;

        const myShipCount = myShipsArr.filter(Boolean).length;
        const oppHits = oppShotsArr.filter(s => s === 'hit').length;

        if (oppShipCount > 0 && myHits === oppShipCount) {
            document.getElementById('statusMessage').textContent = "Gratuluji! Zničil jsi všechny nepřátelské lodě a vyhrál! 🎉";
        } else if (myShipCount > 0 && oppHits === myShipCount) {
            document.getElementById('statusMessage').textContent = "Partnerka potopila všechny tvé lodě, vyhrála ona! 🙈";
        }
    }
</script>
</body>
</html>
