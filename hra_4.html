<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zamilované Lodě ⛵💖</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #fdf2f8;
    color: #4a5568;
    margin: 0;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    touch-action: manipulation;
}
.container {
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(219, 39, 119, 0.1);
    width: 100%;
    max-width: 450px;
    text-align: center;
}
h2 { color: #db2777; margin-top: 0; }
.status-box {
    background: #fdf2f8;
    border: 2px dashed #f472b6;
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 15px;
    font-weight: 600;
    font-size: 0.95rem;
    color: #be185d;
}
.btn {
    background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
    font-family: inherit;
    width: 100%;
    margin-top: 10px;
    box-shadow: 0 4px 15px rgba(219, 39, 119, 0.3);
}
.btn-secondary {
    background: #e2e8f0;
    color: #4a5568;
    box-shadow: none;
}
.board-container {
    margin-top: 15px;
}
.board-title {
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 5px;
    color: #db2777;
}
.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    background: #f472b6;
    padding: 4px;
    border-radius: 8px;
    margin-bottom: 15px;
}
.cell {
    aspect-ratio: 1;
    background: white;
    border: none;
    border-radius: 4px;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
}
.cell:hover { background: #fce7f3; }
input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    margin-bottom: 10px;
    font-family: inherit;
    text-align: center;
    font-size: 1rem;
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
    <h2>Zamilované Lodě ⛵💖</h2>
    
    <!-- SEKCE PRO PŘIPOJENÍ -->
    <div id="setupSection">
        <div class="status-box">Zadejte název místnosti, kterou chcete sdílet s partnerkou (např. "laskyhra123")</div>
        <input type="text" id="roomInput" placeholder="Název místnosti...">
        <button class="btn" onclick="joinGame()">Vstoupit do hry</button>
    </div>

    <!-- SEKCE HRY -->
    <div id="gameSection" class="hidden">
        <div class="status-box" id="statusMessage">Načítání stavu hry...</div>
        
        <!-- Umisťování lodí (fáze 1) -->
        <div id="placementPhase">
            <p style="font-size: 0.85rem;">Kliknutím na políčka umísti své <strong>3 lodě (💖)</strong>:</p>
            <div class="grid" id="placementGrid"></div>
            <button class="btn" id="readyBtn" onclick="setReady()" disabled>Potvrdit rozestavění 💕</button>
        </div>

        <!-- Bojová fáze (fáze 2) -->
        <div id="battlePhase" class="hidden">
            <div class="board-container">
                <div class="board-title">Střílej na nepřátelská políčka:</div>
                <div class="grid" id="shootingGrid"></div>
            </div>
            <div class="board-container">
                <div class="board-title">Tvá obrana:</div>
                <div class="grid" id="myDefenseGrid"></div>
            </div>
        </div>

        <button class="btn btn-secondary" onclick="location.reload()">Opustit hru</button>
    </div>
</div>

<!-- Firebase SDK (v9 modular CDN) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ==========================================
    // SEM VLOŽ SVŮJ FIREBASE CONFIG Z KONZOLE
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyA-RCJcraf1WBLKs48u6521NZO1iGtSPxI",
        authDomain: "laska-web.firebaseapp.com",
        databaseURL: "https://laska-web-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "laska-web",
        storageBucket: "laska-web.firebasestorage.app",
        messagingSenderId: "258056299985",
        appId: "1:258056299985:web:9f30091072f5ece57a2cf0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const BOARD_SIZE = 5; // 5x5 políček pro rychlou a zábavnou mobilní hru
    let roomId = "";
    let playerRole = ""; // "p1" nebo "p2"
    let myShips = Array(25).fill(false);
    let myShots = Array(25).fill(null); // null, 'hit', 'miss'
    let opponentShots = Array(25).fill(null);
    let gameState = {};

    window.joinGame = function() {
        const input = document.getElementById('roomInput').value.trim();
        if (!input) {
            alert("Zadej prosím název místnosti!");
            return;
        }
        roomId = input;
        
        const roomRef = ref(db, 'rooms/' + roomId);
        get(roomRef).then((snapshot) => {
            const val = snapshot.val();
            if (!val) {
                // První hráč zakládá místnost
                playerRole = "p1";
                set(roomRef, {
                    status: 'placement',
                    turn: 'p1',
                    p1Ready: false,
                    p2Ready: false
                });
            } else if (!val.p2Ready && val.status === 'placement' && !val.p2Ships) {
                // Druhý hráč se připojuje
                playerRole = "p2";
            } else {
                // Pokud už jsou oba obsazeni, pustíme jako diváka/p2
                playerRole = "p2";
            }

            document.getElementById('setupSection').classList.add('hidden');
            document.getElementById('gameSection').classList.remove('hidden');
            initPlacementBoard();
            listenToGame();
        });
    }

    function initPlacementBoard() {
        const grid = document.getElementById('placementGrid');
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const btn = document.createElement('button');
            btn.classList.add('cell');
            btn.textContent = '·';
            btn.onclick = () => toggleShip(i, btn);
            grid.appendChild(btn);
        }
    }

    function toggleShip(index, btn) {
        if (myShips.filter(Boolean).length >= 3 && !myShips[index]) {
            alert("Můžeš rozmístit maximálně 3 lodě!");
            return;
        }
        myShips[index] = !myShips[index];
        btn.textContent = myShips[index] ? '💖' : '·';
        btn.style.background = myShips[index] ? '#fce7f3' : 'white';

        const count = myShips.filter(Boolean).length;
        document.getElementById('readyBtn').disabled = (count !== 3);
    }

    window.setReady = function() {
        const updates = {};
        updates[playerRole + 'Ships'] = myShips;
        updates[playerRole + 'Ready'] = true;
        update(ref(db, 'rooms/' + roomId), updates);
        
        document.getElementById('placementPhase').classList.add('hidden');
        document.getElementById('statusMessage').textContent = "Čekáme, až partnerka rozmístí lodě... ⏳";
    }

    function listenToGame() {
        const roomRef = ref(db, 'rooms/' + roomId);
        onValue(roomRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            gameState = data;

            // Kontrola přechodu do bojové fáze
            if (data.p1Ready && data.p2Ready && data.status === 'placement') {
                if (playerRole === 'p1') {
                    update(roomRef, { status: 'battle' });
                }
            }

            if (data.status === 'battle') {
                document.getElementById('placementPhase').classList.add('hidden');
                document.getElementById('battlePhase').classList.remove('hidden');
                renderBattleBoards();
                
                const isMyTurn = data.turn === playerRole;
                document.getElementById('statusMessage').textContent = isMyTurn ? 
                    "Tvůj tah! Zautoč na nepřátelskou mřížku ✨" : 
                    "Na tahu je partnerka, vyčkej na její útok... ☕";
            }
        });
    }

    function renderBattleBoards() {
        // Střelecká mřížka
        const shootGrid = document.getElementById('shootingGrid');
        shootGrid.innerHTML = '';
        const oppKey = playerRole === 'p1' ? 'p2' : 'p1';
        const oppShips = gameState[oppKey + 'Ships'] || [];
        const shotsData = gameState[playerRole + 'Shots'] || Array(25).fill(null);

        for (let i = 0; i < 25; i++) {
            const btn = document.createElement('button');
            btn.classList.add('cell');
            let symbol = '·';
            if (shotsData[i] === 'hit') symbol = '💥';
            if (shotsData[i] === 'miss') symbol = '❌';
            btn.textContent = symbol;
            
            btn.onclick = () => fireShot(i, oppShips, shotsData);
            shootGrid.appendChild(btn);
        }

        // Obranná mřížka (moje lodě + zásahy od soupeře)
        const defenseGrid = document.getElementById('myDefenseGrid');
        defenseGrid.innerHTML = '';
        const myActiveShips = gameState[playerRole + 'Ships'] || Array(25).fill(false);
        const myOpponentShots = gameState[oppKey + 'Shots'] || Array(25).fill(null);

        for (let i = 0; i < 25; i++) {
            const div = document.createElement('div');
            div.classList.add('cell');
            let symbol = '·';
            if (myActiveShips[i]) symbol = '💖';
            if (myOpponentShots[i] === 'hit') symbol = '💥';
            if (myOpponentShots[i] === 'miss') symbol = '❌';
            div.textContent = symbol;
            defenseGrid.appendChild(div);
        }

        // Kontrola výhry
        checkWinCondition(oppShips, shotsData, myActiveShips, myOpponentShots);
    }

    function fireShot(index, oppShips, shotsData) {
        if (gameState.turn !== playerRole) return;
        if (shotsData[index] !== null) return; // Už stříleno

        const isHit = oppShips[index] === true;
        shotsData[index] = isHit ? 'hit' : 'miss';

        const nextTurn = playerRole === 'p1' ? 'p2' : 'p1';

        const updates = {};
        updates[playerRole + 'Shots'] = shotsData;
        updates['turn'] = nextTurn;
        update(ref(db, 'rooms/' + roomId), updates);
    }

    function checkWinCondition(oppShips, myShotsArr, myShipsArr, oppShotsArr) {
        const oppShipCount = oppShips.filter(Boolean).length;
        const myHits = myShotsArr.filter(s => s === 'hit').length;

        const myShipCount = myShipsArr.filter(Boolean).length;
        const oppHits = oppShotsArr.filter(s => s === 'hit').length;

        if (oppShipCount > 0 && myHits === oppShipCount) {
            document.getElementById('statusMessage').textContent = "Gratuluji! Zničil jsi všechny nepřátelské lodě a vyhrál! 🎉💖";
        } else if (myShipCount > 0 && oppHits === myShipCount) {
            document.getElementById('statusMessage').textContent = "Partnerka potopila všechny tvé lodě, vyhrála ona! 🙈💕";
        }
    }
</script>
</body>
</html>
