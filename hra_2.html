<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kolo štěstí 🎡</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #ff477e;
    --primary-dark: #d90429;
    --accent: #ffb703;
    --bg-gradient: radial-gradient(circle at 50% 20%, #2b1055 0%, #7597de 50%, #190828 100%);
    --card-bg: rgba(255, 255, 255, 0.85);
    --text-main: #2b1055;
    --text-muted: #6c757d;
}

body { 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    background: var(--bg-gradient); 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0; 
    padding: 20px; 
    overflow-x: hidden;
}

.card { 
    background: var(--card-bg); 
    backdrop-filter: blur(25px); 
    -webkit-backdrop-filter: blur(25px);
    padding: 40px 30px; 
    border-radius: 36px; 
    box-shadow: 0 30px 60px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.8); 
    width: 100%; 
    max-width: 420px; 
    text-align: center; 
    border: 1px solid rgba(255,255,255,0.6); 
    position: relative;
}

h2 { 
    color: var(--text-main); 
    font-size: 2rem; 
    margin-bottom: 8px; 
    font-weight: 800; 
    letter-spacing: -0.5px; 
}

p { 
    color: var(--text-muted); 
    font-size: 1rem; 
    margin-bottom: 30px; 
    font-weight: 600; 
}

.wheel-container { 
    position: relative; 
    width: 310px; 
    height: 310px; 
    margin: 0 auto 30px auto; 
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15));
}

.wheel { 
    width: 100%; 
    height: 100%; 
    border-radius: 50%; 
    border: 10px solid #ffffff; 
    position: relative; 
    overflow: hidden; 
    background: conic-gradient(
        #ffadad 0deg 72deg, 
        #ffd6a5 72deg 144deg, 
        #fdffb6 144deg 216deg, 
        #caffbf 216deg 288deg, 
        #9bf6ff 288deg 360deg
    ); 
    transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.12, 1); 
    box-shadow: inset 0 0 25px rgba(0,0,0,0.1); 
}

.pointer { 
    position: absolute; 
    top: -12px; 
    left: 50%; 
    transform: translateX(-50%); 
    width: 0; 
    height: 0; 
    border-left: 14px solid transparent; 
    border-right: 14px solid transparent; 
    border-bottom: 28px solid #ff0054; 
    z-index: 20; 
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); 
}

.wheel-center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: #ffffff;
    border: 4px solid #ff0054;
    border-radius: 50%;
    z-index: 10;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.wheel-text { 
    position: absolute; 
    width: 100%; 
    height: 100%; 
    top: 0; 
    left: 0; 
    font-size: 16px; 
    font-weight: 800; 
    color: #2b1055; 
    pointer-events: none; 
}

.wheel-text span { 
    position: absolute; 
    top: 50%; 
    left: 50%; 
    width: 30px;
    height: 30px;
    margin-top: -15px;
    margin-left: -15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center; 
    transform: rotate(var(--deg)) translate(75px) rotate(90deg);
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
}

button { 
    border: none; 
    padding: 16px 24px; 
    border-radius: 18px; 
    font-weight: 700; 
    font-size: 1rem; 
    font-family: inherit; 
    cursor: pointer; 
    width: 100%; 
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
}

.spin-btn { 
    background: linear-gradient(135deg, #ff0054 0%, #ff5400 100%); 
    color: white; 
    box-shadow: 0 10px 25px rgba(255, 0, 84, 0.4); 
    margin-bottom: 12px; 
}

.spin-btn:hover:not(:disabled) { 
    transform: translateY(-3px); 
    box-shadow: 0 15px 30px rgba(255, 0, 84, 0.5); 
}

.spin-btn:active:not(:disabled) {
    transform: translateY(-1px);
}

.spin-btn:disabled { 
    opacity: 0.6; 
    cursor: not-allowed; 
    transform: none;
}

.btn-back { 
    background: rgba(255, 255, 255, 0.7); 
    color: var(--text-main); 
    border: 1px solid rgba(0,0,0,0.06); 
}

.btn-back:hover { 
    background: rgba(255, 255, 255, 0.95); 
}

#prize { 
    margin-top: 24px; 
    font-size: 1.25rem; 
    font-weight: 800; 
    color: var(--text-main); 
    min-height: 40px; 
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="card">
    <h2>Kolo štěstí 🎡</h2>
    <p>Toč a vyhraj dnešní rande!</p>
    
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel-center-dot"></div>
        <div class="wheel" id="wheel">
            <div class="wheel-text">
                <span style="--deg: 36deg;">1</span>
                <span style="--deg: 108deg;">2</span>
                <span style="--deg: 180deg;">3</span>
                <span style="--deg: 252deg;">4</span>
                <span style="--deg: 324deg;">5</span>
            </div>
        </div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spin()">Točit kolem! 🎯</button>
    <button type="button" class="btn-back" onclick="history.back()">⬅ Zpět</button>
    <div id="prize"></div>
</div>

<script>
const prizes = [
    { text: "Snídaně do postele 🥞", angle: 36 },
    { text: "Masáž nohou po celém dni 💆‍♀️", angle: 108 },
    { text: "Kino s velkým popcornem 🍿", angle: 180 },
    { text: "Romantická večeře při svíčkách 🍷", angle: 252 },
    { text: "Výlet do přírody 🌲", angle: 324 }
];

let currentRotation = 0;

function spin() {
    const btn = document.getElementById('spinBtn');
    const wheel = document.getElementById('wheel');
    const prizeDiv = document.getElementById('prize');
    
    btn.disabled = true;
    prizeDiv.innerHTML = "Točím kolo štěstí... 🌀";

    const randomIndex = Math.floor(Math.random() * prizes.length);
    const selectedPrize = prizes[randomIndex];

    const extraSpins = 360 * 6;
    const targetAngle = 360 - selectedPrize.angle;
    currentRotation = extraSpins + targetAngle + (Math.random() * 16 - 8);

    wheel.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
        prizeDiv.innerHTML = "🎉 Výhra: " + selectedPrize.text;
        btn.disabled = false;
    }, 4500);
}
</script>
</body>
</html>
