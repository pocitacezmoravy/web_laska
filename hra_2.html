<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kolo štěstí 🎡</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body { 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    background: radial-gradient(circle at center, #1b4332 0%, #081c15 100%); 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0; 
    padding: 20px; 
}
.card { 
    background: rgba(255, 255, 255, 0.95); 
    backdrop-filter: blur(20px); 
    padding: 35px 30px; 
    border-radius: 32px; 
    box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 40px rgba(43, 138, 62, 0.2); 
    width: 100%; 
    max-width: 420px; 
    text-align: center; 
    border: 1px solid rgba(255,255,255,0.8); 
}
h2 { color: #1b4332; font-size: 1.8rem; margin-bottom: 6px; font-weight: 800; letter-spacing: -0.5px; }
p { color: #52796f; font-size: 0.95rem; margin-bottom: 25px; font-weight: 600; }

.wheel-container { 
    position: relative; 
    width: 290px; 
    height: 290px; 
    margin: 0 auto 25px auto; 
}
.wheel { 
    width: 100%; 
    height: 100%; 
    border-radius: 50%; 
    border: 8px solid #ffffff; 
    position: relative; 
    overflow: hidden; 
    /* 5 výsečí po 72 stupních s prémiovými jemnými pastelovými barvami */
    background: conic-gradient(
        #d8f3dc 0deg 72deg, 
        #b7e4c7 72deg 144deg, 
        #95d5b2 144deg 216deg, 
        #74c69d 216deg 288deg, 
        #52b788 288deg 360deg
    ); 
    transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.12, 1); 
    box-shadow: 0 10px 30px rgba(0,0,0,0.2), inset 0 0 20px rgba(0,0,0,0.1); 
}
.pointer { 
    position: absolute; 
    top: -18px; 
    left: 50%; 
    transform: translateX(-50%); 
    width: 0; 
    height: 0; 
    border-left: 14px solid transparent; 
    border-right: 14px solid transparent; 
    border-bottom: 26px solid #e63946; 
    z-index: 20; 
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); 
}
.wheel-center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    background: #ffffff;
    border: 4px solid #2d6a4f;
    border-radius: 50%;
    z-index: 10;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.wheel-text { 
    position: absolute; 
    width: 100%; 
    height: 100%; 
    top: 0; 
    left: 0; 
    font-size: 13px; 
    font-weight: 800; 
    color: #081c15; 
    pointer-events: none; 
}
.wheel-text span { 
    position: absolute; 
    top: 50%; 
    left: 50%; 
    width: 110px;
    height: 30px;
    margin-top: -15px;
    margin-left: 28px;
    text-align: left;
    transform-origin: left center; 
    transform: rotate(var(--deg));
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(255,255,255,0.9);
}

button { 
    border: none; 
    padding: 15px 24px; 
    border-radius: 16px; 
    font-weight: 700; 
    font-size: 1rem; 
    font-family: inherit; 
    cursor: pointer; 
    width: 100%; 
    transition: all 0.25s ease; 
}
.spin-btn { 
    background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%); 
    color: white; 
    box-shadow: 0 8px 20px rgba(45, 106, 79, 0.4); 
    margin-bottom: 12px; 
}
.spin-btn:hover:not(:disabled) { 
    transform: translateY(-2px); 
    box-shadow: 0 12px 25px rgba(45, 106, 79, 0.5); 
}
.spin-btn:disabled { 
    opacity: 0.6; 
    cursor: not-allowed; 
}
.btn-back { 
    background: #edf2f7; 
    color: #4a5568; 
    border: 1px solid #e2e8f0; 
}
.btn-back:hover { 
    background: #e2e8f0; 
}

#prize { 
    margin-top: 22px; 
    font-size: 1.2rem; 
    font-weight: 800; 
    color: #2d6a4f; 
    min-height: 40px; 
}
</style>
</head>
<body>
<div class="card">
    <h2>Kolo štěstí 🎡</h2>
    <p>Toč a vyhraj dnešní rande!</p>
    
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel-center-dot"></div>
        <div class="wheel" id="wheel">
            <div class="wheel-text">
                <span style="--deg: 36deg;">🥞 Snídaně</span>
                <span style="--deg: 108deg;">💆‍♀️ Masáž</span>
                <span style="--deg: 180deg;">🍿 Kino</span>
                <span style="--deg: 252deg;">🍷 Večeře</span>
                <span style="--deg: 324deg;">🌲 Výlet</span>
            </div>
        </div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spin()">Točit kolem! 🎯</button>
    <button type="button" class="btn-back" onclick="history.back()">⬅ Zpět</button>
    <div id="prize"></div>
</div>

<script>
const prizes = [
    { text: "Snídaně do postele 🥞", angle: 36 },
    { text: "Masáž nohou po celém dni 💆‍♀️", angle: 108 },
    { text: "Kino s velkým popcornem 🍿", angle: 180 },
    { text: "Romantická večeře při svíčkách 🍷", angle: 252 },
    { text: "Výlet do přírody 🌲", angle: 324 }
];

let currentRotation = 0;

function spin() {
    const btn = document.getElementById('spinBtn');
    const wheel = document.getElementById('wheel');
    const prizeDiv = document.getElementById('prize');
    
    btn.disabled = true;
    prizeDiv.innerHTML = "Točím kolo štěstí... 🌀";

    const randomIndex = Math.floor(Math.random() * prizes.length);
    const selectedPrize = prizes[randomIndex];

    const extraSpins = 360 * 6;
    const targetAngle = 360 - selectedPrize.angle;
    currentRotation = extraSpins + targetAngle + (Math.random() * 16 - 8);

    wheel.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
        prizeDiv.innerHTML = "🎉 Výhra: " + selectedPrize.text;
        btn.disabled = false;
    }, 4500);
}
</script>
</body>
</html>
