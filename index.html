<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naše Rande ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #fff7f8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .heart {
            position: fixed;
            bottom: -30px;
            color: rgba(255, 105, 180, 0.5);
            pointer-events: none;
            animation: floatHeart linear forwards;
            z-index: 1;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120vh) translateX(80px) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.15);
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #d63384;
            text-align: center;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        label {
            font-weight: 600;
            color: #495057;
            font-size: 0.95rem;
        }

        input,
        select,
        textarea,
        button {
            padding: 0.8rem 1rem;
            border: 1.5px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #d63384;
            box-shadow: 0 0 0 3px rgba(214, 51, 132, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background-color: #ff4757;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 0.5rem;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        button:hover {
            background-color: #e84118;
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        #confirmationMessage {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #d4edda;
            color: #155724;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Naplánujme si rande ❤️</h1>

        <form id="dateForm">
            <label for="date">Kdy vyrazíme?</label>
            <input type="date" id="date" required>

            <label for="activity">Co budeme dělat?</label>
            <select id="activity" required>
                <option value="Kino a večeře">Kino a večeře 🍿</option>
                <option value="Procházka a piknik">Procházka a piknik 🧺</option>
                <option value="Výlet do přírody">Výlet do přírody 🌲</option>
                <option value="Deskovky a pizza doma">Deskovky a pizza doma 🍕</option>
            </select>

            <label for="note">Nějaké speciální přání?</label>
            <textarea id="note" placeholder="Třeba jakou pizzu si dáme..."></textarea>

            <button type="submit">Odeslat nápad ✨</button>
        </form>

        <div id="confirmationMessage" class="hidden">
            Super! Nápad odeslán, už se moc těším! 🥰
        </div>
    </div>

    <script>
        /* Poletující srdíčka */
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤';

            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.fontSize = (15 + Math.random() * 25) + 'px';
            heart.style.animationDuration = (5 + Math.random() * 6) + 's';

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 11000);
        }

        setInterval(createHeart, 450);

        /* Formulář */
        document.getElementById('dateForm').addEventListener('submit', function(e) {
            e.preventDefault();

            document.getElementById('dateForm').reset();
            document.getElementById('confirmationMessage').classList.remove('hidden');
        });
    </script>

</body>
</html>
