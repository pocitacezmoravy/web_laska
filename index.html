<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co budeme dělat? ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    background-image: linear-gradient(120deg, #fccbdb 0%, #f7f0ac 100%);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    overflow: hidden;
    position: relative;
}

/* Srdíčka */
.heart {
    position: absolute;
    background-color: rgba(255, 105, 180, .3);
    width: 10px;
    height: 10px;
    transform: rotate(-45deg);
    animation: float 10s infinite linear;
}

.heart:before,
.heart:after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    background: inherit;
    border-radius: 50%;
}

.heart:before { top: -5px; left: 0; }
.heart:after { top: 0; left: 5px; }

@keyframes float {
    0% { opacity: 0; transform: rotate(-45deg) translateY(0); }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { opacity: 0; transform: rotate(-45deg) translateY(-100vh); }
}

.heart:nth-child(1) { left: 10%; animation-delay: 0s; }
.heart:nth-child(2) { left: 30%; animation-delay: 2s; }
.heart:nth-child(3) { left: 50%; animation-delay: 4s; }
.heart:nth-child(4) { left: 70%; animation-delay: 6s; }
.heart:nth-child(5) { left: 90%; animation-delay: 8s; }

.card {
    background: white;
    padding: 2.5rem;
    border-radius: 25px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, .1);
    max-width: 450px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 10;
}

.small-question {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: .8rem;
    color: #666;
    font-weight: 600;
}

h1 {
    font-family: 'Playfair Display', serif;
    color: #4a0404;
    font-size: 2.2rem;
    margin-bottom: 1rem;
}

.menu-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.btn-link {
    display: block;
    background: #d63384;
    color: white;
    text-decoration: none;
    padding: 1rem;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 600;
    margin-top: 10px;
    transition: .3s;
}

.btn-link:hover {
    background: #c42b78;
    transform: translateY(-2px);
}
</style>
</head>
<body>

<div class="heart"></div>
<div class="heart"></div>
<div class="heart"></div>
<div class="heart"></div>
<div class="heart"></div>

<div class="card">
    <div class="small-question">Co bys chtěla dělat?</div>
    <h1>Vyber si ❤️</h1>

    <div class="menu-options">
        <a href="rande.html" class="btn-link">❤️ Rande</a>
        <a href="film.html" class="btn-link">🎬 Filmový večer</a>
        <a href="vylet.html" class="btn-link">🌲 Výlet</a>
        <a href="prekvapeni.html" class="btn-link">🎁 Překvapení</a>
    </div>
</div>

</body>
</html>
