<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vše nejlepší k výročí! 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {
    box-sizing: border-box;
}
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #fdf2f8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    overflow-x: hidden;
    touch-action: manipulation;
}
.welcome-container {
    background: white;
    padding: 35px 25px;
    border-radius: 24px;
    box-shadow: 0 15px 35px rgba(219, 39, 119, 0.12);
    width: 100%;
    max-width: 450px;
    text-align: center;
    position: relative;
    z-index: 10;
    animation: fadeIn 0.8s ease-out;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.heart-icon {
    font-size: 3.5rem;
    margin-bottom: 10px;
    animation: pulse 1.5s infinite;
}
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}
h1 {
    color: #db2777;
    font-size: 1.8rem;
    margin-bottom: 10px;
    margin-top: 0;
}
p {
    color: #4b5568;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 25px;
}
.btn-start {
    background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
    color: white;
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 15px;
    cursor: pointer;
    font-weight: 700;
    font-size: 1.1rem;
    font-family: inherit;
    box-shadow: 0 8px 20px rgba(219, 39, 119, 0.35);
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    touch-action: manipulation;
    text-decoration: none;
    margin-bottom: 12px;
}
.btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(219, 39, 119, 0.45);
}
.btn-start:active {
    transform: translateY(0);
}

.btn-menu {
    background: rgba(237, 242, 247, 0.8);
    color: #4a5568;
    width: 100%;
    border: 1px solid rgba(203, 213, 224, 0.6);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
    font-family: inherit;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    touch-action: manipulation;
    text-decoration: none;
}
.btn-menu:hover {
    background: rgba(226, 232, 240, 1);
}
</style>
</head>
<body>

<div class="welcome-container">
    <div class="heart-icon">💖</div>
    <h1>Vše nejlepší k výročí, lásko!</h1>
    <p>Tady jsem pro tebe připravil něco hezkého. Udělej si pohodlí a pojď objevit, co jsempro tebe připravil a třeba rovnou něco naplánovat.</p>
    
    <!-- Tlačítko pro spuštění hry (pexeso.html) -->
    <a href="menu.html" class="btn-start">
        Začít překvapení ✨
    </a>

   
</div>

</body>
</html>
